<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethoscan Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ethoscan-popup-container">
      <!-- Header Section -->
      <div class="ethoscan-popup-header">
        <div class="ethoscan-popup-logo">
          <img src="/assets/off-black-full-logo.svg" alt="Ethos Logo" class="ethoscan-logo-img ethoscan-logo-light" />
          <img src="/assets/off-white-full-logo.svg" alt="Ethos Logo" class="ethoscan-logo-img ethoscan-logo-dark" />
        </div>
      </div>

      <div class="ethoscan:divider"></div>

      <!-- Theme Toggle Section -->
      <div class="ethoscan-popup-section">
        <div class="ethoscan-toggle-row">
          <label class="ethoscan-toggle-label">Theme</label>
          <label class="ethoscan:swap ethoscan:swap-rotate">
            <input
              type="checkbox"
              id="toggle-theme"
              class="ethoscan:theme-controller"
              value="dark"
            />
            <svg class="ethoscan:swap-off ethoscan:h-6 ethoscan:w-6 ethoscan:fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
            </svg>
            <svg class="ethoscan:swap-on ethoscan:h-6 ethoscan:w-6 ethoscan:fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
            </svg>
          </label>
        </div>
      </div>

      <div class="ethoscan:divider"></div>

      <!-- Explorer Toggle Section -->
      <div class="ethoscan-popup-section">
        <h2 class="ethoscan-section-title">Explorers</h2>

        <div class="ethoscan-toggle-row">
          <label class="ethoscan-toggle-label" for="toggle-etherscan">Enable Etherscan</label>
          <input
            type="checkbox"
            id="toggle-etherscan"
            data-explorer="etherscan"
            class="ethoscan:toggle ethoscan:toggle-primary"
            checked
          />
        </div>

        <div class="ethoscan-toggle-row">
          <label class="ethoscan-toggle-label" for="toggle-blockscout">Enable Blockscout</label>
          <input
            type="checkbox"
            id="toggle-blockscout"
            data-explorer="blockscout"
            class="ethoscan:toggle ethoscan:toggle-primary"
            checked
          />
        </div>

        <div class="ethoscan-toggle-row">
          <label class="ethoscan-toggle-label" for="toggle-debank">Enable Debank</label>
          <input
            type="checkbox"
            id="toggle-debank"
            data-explorer="debank"
            class="ethoscan:toggle ethoscan:toggle-primary"
            checked
          />
        </div>

        <div class="ethoscan-toggle-row">
          <label class="ethoscan-toggle-label" for="toggle-routescan">Enable Routescan</label>
          <input
            type="checkbox"
            id="toggle-routescan"
            data-explorer="routescan"
            class="ethoscan:toggle ethoscan:toggle-primary"
            checked
          />
        </div>
      </div>

      <div class="ethoscan:divider"></div>

      <!-- Footer Section -->
      <div class="ethoscan-popup-footer">
        <div class="ethoscan-footer-links">
          <a href="https://github.com/starfrich/ethos-scan" target="_blank" rel="noopener noreferrer" class="ethoscan:link">
            GitHub
          </a>
          <span class="ethoscan-link-separator">•</span>
          <a href="https://docs.ethos.network" target="_blank" rel="noopener noreferrer" class="ethoscan:link">
            Docs
          </a>
          <span class="ethoscan-link-separator">•</span>
          <a href="https://ethos.network" target="_blank" rel="noopener noreferrer" class="ethoscan:link">
            Ethos
          </a>
        </div>
        <div class="ethoscan-attribution">Data provided by Ethos Network</div>
        <div class="ethoscan-version" id="version">v0.1.0</div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
